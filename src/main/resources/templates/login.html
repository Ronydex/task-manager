<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Iniciar Sesión</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { display: block; width: 92%; padding: 8px; margin: 10px 0; }
        button { width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
        .link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="mensajeError" class="error"></div>
        <div class="link">
            <a href="registro.html">¿No tienes cuenta? Regístrate aquí</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('mensajeError');

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('jwtToken', data.token);
                    // Redirección a la pantalla principal
                    window.location.href = 'tareas.html';
                } else {
                    errorDiv.innerText = data.message || "Credenciales incorrectas";
                }
            } catch (err) {
                errorDiv.innerText = "Error al conectar con el servidor";
            }
        });
    </script>
</body>
</html>
