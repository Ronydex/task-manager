<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas - Administrador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-layout">
        <header class="top-header">
            <h1>Vista de Tareas</h1>
            <button id="btnLogout" class="btn-danger">Cerrar sesión</button>
        </header>

        <!-- Formulario Crear Nueva Tarea -->
        <section class="card-box">
            <h2>Crear Nueva Tarea</h2>
            <form id="formTarea">
                <div class="form-group">
                    <input type="text" id="tituloTarea" placeholder="Título de la tarea" required />
                </div>

                <div class="form-group">
                    <textarea id="descripcionTarea" placeholder="Descripción detallada de la tarea" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="estadoActTar">Estado de la Tarea:</label>
                    <select id="estadoActTar" required>
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="EN_PROCESO">EN PROCESO</option>
                        <option value="SOLUCION_PLANIFICADA">SOLUCION PLANIFICADA</option>
                        <option value="RELEVADO">RELEVADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                        <option value="FINALIZADO">FINALIZADO</option>
                    </select>
                </div>

                <div class="user-row">
                    <div class="user-field">
                        <label>Creado Por:</label>
                        <div class="input-duo">
                            <span class="badge-id" id="creadoPorId">3</span>
                            <input type="text" id="creadoPorNombre" value="aaron" readonly />
                        </div>
                    </div>

                    <div class="user-field">
                        <label>Asignado a:</label>
                        <div class="input-duo">
                            <span class="badge-id" id="asignadoAId">1</span>
                            <select id="asignadoASelect" onchange="document.getElementById('asignadoAId').innerText = this.value">
                                <option value="1">aaron (ID: 1)</option>
                                <option value="2">carlos (ID: 2)</option>
                                <option value="3">rtest (ID: 3)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 15px;">Guardar Tarea</button>
            </form>
        </section>

        <!-- Listado de Tareas Registradas -->
        <section class="card-box">
            <div class="section-header">
                <h2>Tareas Registradas:</h2>
                <div class="header-controls">
                    <div id="contadorTareas" class="badge-count">No. Tareas: 0</div>
                    <button id="btnRefrescar" class="btn-primary" onclick="cargarTareas()">Refrescar Tareas</button>
                </div>
            </div>

            <!-- Panel con Scroll para las Tarjetas -->
            <div id="listaTareasContainer" class="scroll-panel">
                <!-- Tarjetas dinámicas -->
            </div>
        </section>
    </div>

    <script src="tareas.js"></script>
</body>
</html>
