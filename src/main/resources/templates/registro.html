<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Task Manager - Registro</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, select { display: block; width: 92%; padding: 8px; margin: 10px 0; }
        button { width: 100%; background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-top: 10px; font-size: 14px; }
        .link { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Crear Cuenta</h2>
        <form id="formRegistro">
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            
            <label for="rol">Rol en el sistema:</label>
            <select id="rol">
                <option value="ROL_PM">PROJECT MANAGER</option>
                <option value="ROL_DEV">DEVELOPER</option>
                <option value="ADMIN">ADMINISTRATOR</option>
                <option value="CLIENTE">CLIENT</option>
            </select>

            <button type="submit">Registrarse</button>
        </form>
        <div id="mensajeError" class="error"></div>
        <div class="link">
            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rolAsignado = document.getElementById('rol').value;
            const errorDiv = document.getElementById('mensajeError');

            try {
                const res = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password, rolAsignado })
                });

                if (res.ok) {
                    alert("¡Registro exitoso! Ahora puedes iniciar sesión.");
                    window.location.href = 'login.html';
                } else {
                    const data = await res.json();
                    errorDiv.innerText = data.message || "Error al registrar el usuario";
                }
            } catch (err) {
                errorDiv.innerText = "Error al conectar con el servidor";
            }
        });
    </script>
</body>
</html>
